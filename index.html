        :root {
            --bg-dark: #0b0e14;
            --bg-card: #151921;

            --text-main: #f0f4f8;
            --text-muted: #8a96a8;
            --accent: #3b82f6;
            --green: #10b981;
            --green-bg: rgba(16, 185, 129, 0.12);

        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Ticker Bar */
        .ticker-wrap {
            width: 100%;
            background-color: #06080b;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            white-space: nowrap;
            padding: 0.6rem 0;
        }

        .ticker {
            display: inline-block;
            animation: marquee 30s linear infinite;
